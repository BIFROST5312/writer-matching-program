      let ticking = false;

        if (!ticking) {
          window.requestAnimationFrame(() => {
            const scrollY = window.scrollY;
            if (scrollY < 400 && heroImg) {
              // Subtle scale and translateY
              heroImg.style.transform = `scale(1.05) translateY(${scrollY * 0.15}px)`;
            }
            ticking = false;
          });
          ticking = true;
        }

    });
