<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;family=Noto+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>

"],"headline-sm":["EB Garamond"],"label-sm":["Hanken Grotesk"]},"fontSize":{"display-lg-mobile":["32px",{"lineHeight":"1.2","fontWeight":"600"}],"display-lg":["48px",{"lineHeight":"1.1","letterSpacing":"-0.02em","fontWeight":"600"}],"label-md":["14px",{"lineHeight":"1.2","letterSpacing":"0.05em","fontWeight":"600"}],"headline-md":["32px",{"lineHeight":"1.3","fontWeight":"500"}],"body-md":["16px",{"lineHeight":"1.6","fontWeight":"400"}],"body-lg":["18px",{"lineHeight":"1.6","fontWeight":"400"}],"headline-sm":["24px",{"lineHeight":"1.4","fontWeight":"500"}],"label-sm":["12px",{"lineHeight":"1.2","fontWeight":"500"}]}}}}</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;overflow-x:hidden;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface min-h-screen flex flex-col justify-center"><main class="relative w-full"><div class="flex flex-col w-full h-full justify-between pb-safe pt-safe relative">
<!-- Background Texture -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>
<!-- Header Section -->
<header class="flex justify-between items-center px-gutter py-margin-mobile relative z-10">
<div class="w-8"></div> <!-- Spacer -->
<!-- Language Toggle -->
<button class="flex items-center space-x-2 bg-secondary-container text-on-secondary-container px-3 py-1.5 rounded-full shadow-sm hover:shadow-md transition-shadow duration-300" id="lang-toggle">
<span class="material-symbols-outlined text-[18px]">language</span>
<span class="font-label-md">EN</span>
</button>
</header>
<!-- Main Content (Centered) -->
<section class="flex-grow flex flex-col items-center justify-center px-gutter relative z-10 space-y-12 mb-24">
<!-- Decorative Ornament -->
<div class="text-tertiary-container opacity-60">
<svg fill="none" height="40" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1" viewbox="0 0 24 24" width="40">
<path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
</svg>
</div>
<!-- Quote & Title -->
<div class="text-center space-y-6 max-w-[320px]">
<p class="font-headline-md text-on-surface leading-relaxed opacity-90 transition-opacity duration-700 ease-in-out" id="main-quote">
                "종이 위에서 만나는<br/>영혼의 울림"
            </p>
<h1 class="font-display-lg-mobile text-primary tracking-tight">
                당신의 문학적<br/>동반자를 찾아보세요
            </h1>
</div>
<!-- Call to Action -->
<div class="w-full flex justify-center mt-margin-desktop">
<button class="group relative inline-flex items-center justify-center px-8 py-4 bg-tertiary-container text-on-tertiary-container rounded-full overflow-hidden shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 active:shadow-md" id="start-button" type="button">
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
<span class="font-label-md tracking-wider mr-2">시작하기</span>
<span class="material-symbols-outlined text-[20px] transform group-hover:translate-x-1 transition-transform duration-300">east</span>
</button>
</div>
</section>
<!-- Footer Decorative Element -->
<div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-surface-dim to-transparent pointer-events-none z-0"></div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const langToggle = document.getElementById('lang-toggle');
        const langText = langToggle?.querySelector('span:last-child');
        const mainQuote = document.getElementById('main-quote');
        const titleText = document.querySelector('h1');
        const btnText = document.querySelector('button.group span:first-of-type');
        const startButton = document.getElementById('start-button');

        let isKorean = true;

        if (langToggle) langToggle.addEventListener('click', () => {
            isKorean = !isKorean;
            
            // Fade out
            mainQuote.style.opacity = '0';
            titleText.style.opacity = '0';
            btnText.style.opacity = '0';
            
            setTimeout(() => {
                if (isKorean) {
                    langText.textContent = 'EN';
                    mainQuote.innerHTML = '"종이 위에서 만나는<br>영혼의 울림"';
                    titleText.innerHTML = '당신의 문학적<br>동반자를 찾아보세요';
                    btnText.textContent = '시작하기';
                } else {
                    langText.textContent = 'KR';
                    mainQuote.innerHTML = '"An echo of the soul<br>met on paper"';
                    titleText.innerHTML = 'Find Your<br>Literary Companion';
                    btnText.textContent = 'Begin';
                }
                
                // Fade in
                mainQuote.style.opacity = '0.9';
                titleText.style.opacity = '1';
                btnText.style.opacity = '1';
            }, 300); // Wait for fade out
        });

        startButton?.addEventListener('click', () => {
            window.location.href = '../_18/code.html';
        });
    });
</script></main><script src="../language-switcher.js?v=14"></script></body></html>
