<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>작가 매칭 | Library</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { paper: '#fff8f3', ink: '#201b12', wood: '#350f03', muted: '#746c62' },
            fontFamily: { serif: ['EB Garamond', 'Noto Serif KR', 'serif'], sans: ['Noto Sans KR', 'sans-serif'] }
          }
        }
      }
    </script>
  </head>
  <body class="min-h-screen bg-paper font-sans text-ink">
    <header class="sticky top-0 z-10 border-b border-wood/10 bg-paper/90 px-5 py-5 backdrop-blur">
      <p class="font-serif text-sm tracking-[0.22em] text-muted">LITERARY MATCH</p>
      <div class="mt-1 flex items-end justify-between">
        <h1 class="font-serif text-4xl font-semibold">Writer Profile</h1>
        <a class="rounded-full border border-ink px-3 py-1 text-sm" href="../_15/code.html">처음으로</a>
      </div>
      <p class="mt-2 text-sm text-muted">다른 문학적 동반자들을 만나보세요.</p>
    </header>
    <main class="mx-auto max-w-2xl px-5 pb-24 pt-6">
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-3" id="author-list"></div>
    </main>
    <nav class="fixed bottom-0 left-0 right-0 border-t border-wood/10 bg-paper/95 px-5 py-3 backdrop-blur">
      <div class="mx-auto flex max-w-2xl justify-around text-sm">
        <a class="text-muted" href="../_15/code.html">Match</a>
        <span class="font-bold">Library</span>
      </div>
    </nav>
    <script>
      const authors = [
        ['이상', 1], ['나쓰메 소세키', 2], ['아쿠타가와 류노스케', 3], ['미겔 데 세르반테스', 4],
        ['레프 톨스토이', 5], ['프란츠 카프카', 6], ['헤르만 헤세', 7], ['알베르 카뮈', 8],
        ['단테 알리기에리', 9], ['루쉰', 10], ['나관중', 11], ['표도르 도스토옙스키', 12],
        ['제인 오스틴', 13], ['호르헤 루이스 보르헤스', 14], ['에밀리 브론테', 16], ['요한 볼프강 폰 괴테', 17]
      ];
      document.getElementById('author-list').innerHTML = authors.map(([name, id]) => `
        <a class="group rounded-2xl border border-wood/15 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:border-wood hover:shadow-md" href="../_${id}/code.html?from=library">
          <span class="font-serif text-3xl text-wood/70">${String(id).padStart(2, '0')}</span>
          <span class="mt-6 block break-keep font-serif text-xl leading-tight group-hover:text-wood">${name}</span>
          <span class="mt-2 block text-xs text-muted">작가 결과 보기 →</span>
        </a>
      `).join('');
    </script>
  <script src="../language-switcher.js?v=20"></script></body>
</html>
